name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build client
        run: npm run build:client

      - name: Build server
        run: npm run build:server

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quak:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run -d --name quak-ci -p 3001:3001 \
            -e MOCK_LLM=true \
            quak:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/livez > /dev/null; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/livez
          curl -fsS http://127.0.0.1:3001/api/health
          docker logs quak-ci
          docker rm -f quak-ci
