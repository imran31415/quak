apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quak
  labels:
    app.kubernetes.io/name: quak
    app.kubernetes.io/component: server
spec:
  replicas: 1
  serviceName: quak-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: quak
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quak
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: quak
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: umi-backend
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: registry.digitalocean.com/resourceloop/quak:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quak-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Default V8 heap is ~1.7 GB and is the actual ceiling for big-CSV
            # imports — the parse path allocates ~3x file size in JS strings
            # and arrays. Bump to 3 GB so we can handle 100+ MB CSVs without
            # FATAL Out of memory. Pod memory limit below must be ≥ this.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=3072"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              # Multer's memory-storage holds the upload buffer (≤256 MB), then
              # parseCSV explodes ~3× the file size into V8 strings/arrays.
              # NODE_OPTIONS sets heap to 3 GB; pod limit at 4 GB leaves room
              # for the multer buffer + V8 native overhead.
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/livez
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/quak
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: quak
          app.kubernetes.io/component: server
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
