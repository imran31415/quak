apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quak-dev

nameSuffix: -dev

commonLabels:
  app.kubernetes.io/instance: dev
  app.kubernetes.io/environment: dev

resources:
  - ../../base

patches:
  - path: namespace.yaml
    target:
      kind: Namespace
      name: quak
  - path: ingress.yaml
    target:
      kind: Ingress
      name: quak
  - path: statefulset.yaml
    target:
      kind: StatefulSet
      name: quak
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: quak-config

images:
  - name: ghcr.io/imran31415/quak
    newTag: dev
