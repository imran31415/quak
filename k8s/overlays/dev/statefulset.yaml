apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quak
spec:
  template:
    spec:
      containers:
        - name: server
          # Mutable :dev tag — always re-pull so rollout restart picks up new builds.
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Match prod headroom for large-file imports (multer memoryStorage
              # spikes RAM during 100+ MB CSV parse → INSERT). Dev sees the same
              # workloads in tests.
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
