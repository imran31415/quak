apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quak
spec:
  template:
    spec:
      containers:
        - name: server
          # Mutable :dev tag — always re-pull so rollout restart picks up new builds.
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Match prod (4 GB). Multer + parseCSV spike to ~3 GB on large
              # imports; V8 heap is bumped to 3 GB via NODE_OPTIONS in base.
              cpu: "2"
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
