apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quak

commonLabels:
  app.kubernetes.io/instance: prod
  app.kubernetes.io/environment: prod

resources:
  - ../../base

patches:
  - path: ingress.yaml
    target:
      kind: Ingress
      name: quak
  - path: statefulset.yaml
    target:
      kind: StatefulSet
      name: quak

images:
  - name: registry.digitalocean.com/resourceloop/quak
    newTag: v1.0.0
