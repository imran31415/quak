apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quak
spec:
  template:
    spec:
      containers:
        - name: server
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Match base — 4 GB so V8 heap (3 GB) + multer buffer + native
              # overhead fit during large CSV imports.
              cpu: "2"
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
